/* =================================================================
   CONFIGURAÇÃO DO FIREBASE
   Não precisa editar nada aqui. Na primeira vez que você abrir este
   arquivo no navegador, ele vai pedir os dados do seu projeto Firebase
   numa tela própria, e vai guardar isso no navegador (localStorage).
   ================================================================= */
let db = null;
let firebaseInitDone = false;

function getStoredFirebaseConfig() {
  try {
    const raw = localStorage.getItem("pcp_firebase_config");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveFirebaseConfig(cfg) {
  try { localStorage.setItem("pcp_firebase_config", JSON.stringify(cfg)); } catch (e) {}
}
function clearFirebaseConfig() {
  try { localStorage.removeItem("pcp_firebase_config"); } catch (e) {}
}
function initFirebase(cfg) {
  try {
    if (firebase.apps && firebase.apps.length) {
      // já inicializado nesta sessão (evita erro de dupla inicialização)
      db = firebase.firestore();
      firebaseInitDone = true;
      return true;
    }
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    firebaseInitDone = true;
    return true;
  } catch (e) {
    console.error("Firebase não inicializado:", e);
    return false;
  }
}

/* ---------------- Firestore helpers ---------------- */
async function getDocSafe(path) {
  if (!db) return null;
  try {
    const snap = await db.doc(path).get();
    return snap.exists ? snap.data() : null;
  } catch (e) {
    console.error("getDoc", path, e);
    return null;
  }
}
async function setDocSafe(path, data) {
  if (!db) return false;
  try {
    await db.doc(path).set(data);
    return true;
  } catch (e) {
    console.error("setDoc", path, e);
    return false;
  }
}
async function listCollectionSafe(path) {
  if (!db) return [];
  try {
    const snap = await db.collection(path).get();
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.error("listCollection", path, e);
    return [];
  }
}
async function deleteDocSafe(path) {
  if (!db) return false;
  try {
    await db.doc(path).delete();
    return true;
  } catch (e) {
    console.error("deleteDoc", path, e);
    return false;
  }
}

function isoWeekLabel(mondayDate) {
  const d = new Date(mondayDate);
  const opts = { day: "2-digit", month: "2-digit" };

  return `${d.toLocaleDateString("pt-BR", opts)} – ${sat.toLocaleDateString("pt-BR", opts)}`;
}
function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

/* ---------------- Simple SVG charts (no external chart lib needed) ---------------- */
function SimpleLineChart({ data, height = 200, color = BLUE }) {
  if (!data.length) return null;
  const w = 600, pad = 32;
  const maxY = 100, minY = 0;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const yFor = (v) => height - pad - ((v - minY) / (maxY - minY)) * (height - pad * 2);
  const xFor = (i) => pad + i * stepX;
  const points = data.map((d, i) => `${xFor(i)},${yFor(d.ppc || 0)}`).join(" ");
  const y80 = yFor(80), y90 = yFor(90);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height}>
      <line x1={pad} y1={y80} x2={w-pad} y2={y80} stroke={GREEN} strokeDasharray="4 4" strokeWidth="1" />
      <line x1={pad} y1={y90} x2={w-pad} y2={y90} stroke={GREEN} strokeDasharray="4 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={xFor(i)} cy={yFor(d.ppc || 0)} r="3" fill={color} />
      ))}
      {data.map((d, i) => (
        i % Math.ceil(data.length / 6 || 1) === 0 ? (
          <text key={i} x={xFor(i)} y={height - 8} fontSize="9" fill="#888" textAnchor="middle">{d.label}</text>
        ) : null
      ))}
    </svg>
  );
}
function SimpleBarChartH({ data, height, colorFor }) {
  const w = 600, pad = 8, labelW = 140;
  const max = Math.max(1, ...data.map((d) => d.count));
  const rowH = 26;
  const h = height || data.length * rowH + pad * 2;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h}>
      {data.map((d, i) => {
        const barW = ((w - labelW - pad * 2) * d.count) / max;
        const y = pad + i * rowH;
        return (
          <g key={i}>
            <text x={pad} y={y + rowH / 2 + 4} fontSize="10" fill="#ccc">{d.causa.length > 24 ? d.causa.slice(0,24)+"…" : d.causa}</text>
            <rect x={labelW} y={y + 4} width={Math.max(2,barW)} height={rowH - 10} fill={colorFor(i)} rx="2" />
            <text x={labelW + barW + 6} y={y + rowH / 2 + 4} fontSize="10" fill="#aaa">{d.count}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------------- Storage-facade layer backed by Firestore ---------------- */
function makeApi(obraId) {
  return {
    async getSetores() { const d = await getDocSafe(`obras/${obraId}/data/setores`); return d?.list || DEFAULT_SETORES; },
    async setSetores(list) { return setDocSafe(`obras/${obraId}/data/setores`, { list }); },
    async getEncarregados() { const d = await getDocSafe(`obras/${obraId}/data/encarregados`); return d?.list || DEFAULT_ENCARREGADOS; },
    async setEncarregados(list) { return setDocSafe(`obras/${obraId}/data/encarregados`, { list }); },
    async getEquipes() { const d = await getDocSafe(`obras/${obraId}/data/equipes`); return d?.list || DEFAULT_EQUIPES; },
    async setEquipes(list) { return setDocSafe(`obras/${obraId}/data/equipes`, { list }); },
    async getRestricoes() { const d = await getDocSafe(`obras/${obraId}/data/restricoes`); return d?.list || []; },
    async setRestricoes(list) { return setDocSafe(`obras/${obraId}/data/restricoes`, { list }); },
    async listWeeks() { return listCollectionSafe(`obras/${obraId}/semanas`); },
    async getWeek(wk) { const d = await getDocSafe(`obras/${obraId}/semanas/${wk}`); return d?.tasks || []; },
    async setWeek(wk, tasks) { return setDocSafe(`obras/${obraId}/semanas/${wk}`, { tasks }); },
  };
}

/* =================================================================
   APP ROOT — decide entre tela de configuração do Firebase e o app
   ================================================================= */
function AppRoot() {
  const [ready, setReady] = useState(false);
  const [needsSetup, setNeedsSetup] = useState(false);

  useEffect(() => {
    const stored = getStoredFirebaseConfig();
    if (stored && initFirebase(stored)) {
      setReady(true);
    } else {
      setNeedsSetup(true);
    }
  }, []);

  const handleSaved = (cfg) => {
    saveFirebaseConfig(cfg);
    if (initFirebase(cfg)) {
      setNeedsSetup(false);
      setReady(true);
    }
  };

  if (needsSetup) return <FirebaseSetupScreen onSaved={handleSaved} />;
  if (!ready) return <div className="min-h-screen flex items-center justify-center bg-neutral-950"><img src={MASN_ICON} className="w-12 h-12 animate-pulse" /></div>;
  return <PCPApp />;
}

function FirebaseSetupScreen({ onSaved }) {
  const [cfg, setCfg] = useState({ apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:"" });
  const [erro, setErro] = useState("");
  const [colado, setColado] = useState("");
  const [modo, setModo] = useState("colar"); // "colar" | "manual"
  const fields = [
    { key:"apiKey", label:"apiKey" },
    { key:"authDomain", label:"authDomain" },
    { key:"projectId", label:"projectId" },
    { key:"storageBucket", label:"storageBucket" },
    { key:"messagingSenderId", label:"messagingSenderId" },
    { key:"appId", label:"appId" },
  ];

  const parseColado = (texto) => {
    setColado(texto);
    const next = { ...cfg };
    fields.forEach((f) => {
      const re = new RegExp(f.key + '\\s*:\\s*"([^"]*)"');
      const m = texto.match(re);
      if (m) next[f.key] = m[1];
    });
    setCfg(next);
    setErro("");
  };

  const submit = () => {
    const faltando = fields.filter((f) => !cfg[f.key].trim());
    if (faltando.length) { setErro(`Faltou: ${faltando.map((f)=>f.label).join(", ")}. Confira se colou o bloco inteiro, do "const firebaseConfig" até o "};".`); return; }
    setErro("");
    onSaved(cfg);
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4 bg-neutral-950 text-neutral-100 px-6 py-10">
      <img src={MASN_ICON} className="w-12 h-12" />
      <div className="text-center max-w-sm">
        <div className="text-base font-bold">Configurar Firebase</div>
        <div className="text-[12px] text-neutral-500 mt-1">
          Primeira vez abrindo o PCP neste navegador. Isso só precisa ser feito uma vez por dispositivo.
        </div>
      </div>
      <div className="w-full max-w-sm flex gap-1.5 mb-1">
        <button onClick={()=>setModo("colar")} className="flex-1 text-[11px] font-semibold py-1.5 rounded-md" style={{background:modo==="colar"?ORANGE:"#262626", color:modo==="colar"?BLACK:"#999"}}>Colar bloco inteiro</button>
        <button onClick={()=>setModo("manual")} className="flex-1 text-[11px] font-semibold py-1.5 rounded-md" style={{background:modo==="manual"?ORANGE:"#262626", color:modo==="manual"?BLACK:"#999"}}>Preencher campo a campo</button>
      </div>
      {modo === "colar" ? (
        <div className="w-full max-w-sm space-y-2">
          <div className="text-[11px] text-neutral-500">
            No Firebase, toque no ícone de copiar (📋) do bloco de código que começa com <code className="text-orange-400">const firebaseConfig = {"{"}</code>. Depois volte aqui e cole tudo na caixa abaixo.
          </div>
          <textarea value={colado} onChange={(e)=>parseColado(e.target.value)} rows={6}
            placeholder='Cole aqui todo o bloco, incluindo: const firebaseConfig = { apiKey: "...", ... };'
            className="w-full bg-neutral-900 border border-neutral-700 rounded-md px-3 py-2.5 text-xs outline-none focus:border-orange-500 font-mono" />
          <div className="grid grid-cols-2 gap-1.5">
            {fields.map((f) => (
              <div key={f.key} className="text-[10px] px-2 py-1.5 rounded border" style={{borderColor: cfg[f.key] ? GREEN : "#404040", color: cfg[f.key] ? GREEN : "#666"}}>
                {cfg[f.key] ? "✓" : "—"} {f.label}
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="w-full max-w-sm space-y-2">
          {fields.map((f) => (
            <input key={f.key} value={cfg[f.key]} onChange={(e)=>setCfg((c)=>({...c,[f.key]:e.target.value}))}
              placeholder={f.label}
              className="w-full bg-neutral-900 border border-neutral-700 rounded-md px-3 py-2.5 text-sm outline-none focus:border-orange-500" />
          ))}
        </div>
      )}
      <div className="w-full max-w-sm space-y-2">
        {erro && <div className="text-[11px]" style={{color:RED}}>{erro}</div>}
        <button onClick={submit} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2.5 text-sm font-semibold mt-1" style={{background:ORANGE,color:BLACK}}>
          Salvar e continuar
        </button>
      </div>
      <div className="text-[11px] text-neutral-600 max-w-sm text-center mt-2">
        Se algum campo não preencher sozinho, dá pra corrigir na aba "Preencher campo a campo".
      </div>
    </div>
  );
}

   APP
   ================================================================= */
function PCPApp() {
  const [checkingAccess, setCheckingAccess] = useState(true);
  const [unlocked, setUnlocked] = useState(false);
  const [accessPassword, setAccessPassword] = useState(DEFAULT_PASSWORD);

  const [loading, setLoading] = useState(true);
  const [obras, setObras] = useState([]);
  const [activeObraId, setActiveObraId] = useState(null);
  const [obra, setObra] = useState(null);
  const [setores, setSetores] = useState(DEFAULT_SETORES);
  const [encarregados, setEncarregados] = useState(DEFAULT_ENCARREGADOS);
  const [equipes, setEquipes] = useState(DEFAULT_EQUIPES);
  const [restricoes, setRestricoes] = useState([]);
  const [weeks, setWeeks] = useState({});
  const [currentMonday, setCurrentMonday] = useState(mondayOf(new Date()));
  const [tab, setTab] = useState("restricoes");
  const [saving, setSaving] = useState(false);

  const api = useMemo(() => (activeObraId ? makeApi(activeObraId) : null), [activeObraId]);

  useEffect(() => {
    (async () => {
      const cfg = await getDocSafe("config/accessPassword");
      setAccessPassword(cfg?.value || DEFAULT_PASSWORD);
      setCheckingAccess(false);
    })();
  }, []);

  const updatePassword = async (novaSenha) => {
    const pwd = novaSenha.trim() || DEFAULT_PASSWORD;
    setAccessPassword(pwd);
    await setDocSafe("config/accessPassword", { value: pwd });
  };

  const loadObras = useCallback(async () => {
    const list = await listCollectionSafe("obras");
    setObras(list);
    return list;
  }, []);

  const loadObraData = useCallback(async (id, obrasList) => {
    const a = makeApi(id);
    const [s, e, eq, r, wkDocs] = await Promise.all([
      a.getSetores(), a.getEncarregados(), a.getEquipes(), a.getRestricoes(), a.listWeeks(),
    ]);
    const weekData = {};
    wkDocs.forEach((w) => { weekData[w.id] = w.tasks || []; });
    setSetores(s); setEncarregados(e); setEquipes(eq); setRestricoes(r); setWeeks(weekData);
    const found = obrasList.find((o) => o.id === id);
    if (found) setObra(found);
  }, []);

  useEffect(() => {
    if (!unlocked) return;
    (async () => {
      setLoading(true);
      const list = await loadObras();
      if (list.length === 0) {
        setActiveObraId(null); setObra(null); setLoading(false); return;
      }
      const id = list[0].id;
      setActiveObraId(id);
      await loadObraData(id, list);
      setLoading(false);
    })();
  }, [unlocked, loadObras, loadObraData]);

  const wk = weekKey(currentMonday);
  const tasks = weeks[wk] || [];

  const updateTasks = async (newTasks) => {
    if (!api) return;
    setWeeks((prev) => ({ ...prev, [wk]: newTasks }));
    setSaving(true);
    await api.setWeek(wk, newTasks);
    setSaving(false);
  };
  const addTask = (task) => updateTasks([...tasks, { id: uid(), status: "pendente", causa: "", restricaoId: null, ...task }]);
  const removeTask = (id) => updateTasks(tasks.filter((t) => t.id !== id));
  const patchTask = (id, patch) => updateTasks(tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)));

  const addSetor = async (name) => {
    if (!name.trim() || setores.includes(name.trim())) return;
    const next = [...setores, name.trim()]; setSetores(next); await api.setSetores(next);
  };
  const removeSetor = async (name) => {
    const next = setores.filter((s) => s !== name); setSetores(next); await api.setSetores(next);
  };
  const addEncarregado = async (name) => {
    if (!name.trim() || encarregados.includes(name.trim())) return;
    const next = [...encarregados, name.trim()]; setEncarregados(next); await api.setEncarregados(next);
  };
  const removeEncarregado = async (name) => {
    const next = encarregados.filter((s) => s !== name); setEncarregados(next); await api.setEncarregados(next);
  };
  const addEquipe = async (name) => {
    if (!name.trim() || equipes.includes(name.trim())) return;
    const next = [...equipes, name.trim()]; setEquipes(next); await api.setEquipes(next);
  };
  const removeEquipe = async (name) => {
    const next = equipes.filter((s) => s !== name); setEquipes(next); await api.setEquipes(next);
  };

  const updateObra = async (patch) => {
    const next = { ...obra, ...patch, id: obra.id };
    setObra(next);
    const nextObras = obras.map((o) => (o.id === next.id ? next : o));
    setObras(nextObras);
    await setDocSafe(`obras/${next.id}`, { nome: next.nome, local: next.local, engenheiro: next.engenheiro, entrega: next.entrega || "" });
  };

  const switchObra = async (id) => {
    if (id === activeObraId) return;
    setLoading(true);
    setActiveObraId(id);
    await loadObraData(id, obras);
    setCurrentMonday(mondayOf(new Date()));
    setTab("restricoes");
    setLoading(false);
  };

  const createObra = async (nome) => {
    const newId = uid();
    const newObra = { id: newId, nome: nome?.trim() || "Nova obra", local: "", engenheiro: "", entrega: "" };
    await setDocSafe(`obras/${newId}`, { nome: newObra.nome, local: "", engenheiro: "", entrega: "" });
    const a = makeApi(newId);
    await Promise.all([
      a.setSetores(DEFAULT_SETORES), a.setEncarregados(DEFAULT_ENCARREGADOS),
      a.setEquipes(DEFAULT_EQUIPES), a.setRestricoes([]),
    ]);
    const nextObras = [...obras, newObra];
    setObras(nextObras);
    setActiveObraId(newId); setObra(newObra);
    setSetores(DEFAULT_SETORES); setEncarregados(DEFAULT_ENCARREGADOS); setEquipes(DEFAULT_EQUIPES);
    setWeeks({}); setRestricoes([]);
    setCurrentMonday(mondayOf(new Date()));
  };

  const removeObra = async (id) => {
    await deleteDocSafe(`obras/${id}`);
    const nextObras = obras.filter((o) => o.id !== id);
    setObras(nextObras);
    if (id === activeObraId) {
      if (nextObras.length > 0) { await switchObra(nextObras[0].id); }
      else {
        setActiveObraId(null); setObra(null);
        setSetores(DEFAULT_SETORES); setEncarregados(DEFAULT_ENCARREGADOS); setEquipes(DEFAULT_EQUIPES);
        setWeeks({}); setRestricoes([]);
      }
    }
  };

  const persistRestricoes = async (next) => {
    if (!api) return;
    setRestricoes(next); setSaving(true); await api.setRestricoes(next); setSaving(false);
  };
  const addRestricao = (r) => {
    const novaId = uid();
    persistRestricoes([...restricoes, { id: novaId, status: "aberta", ...r }]);
    return novaId;
  };
  const patchRestricao = (id, patch) => persistRestricoes(restricoes.map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const removeRestricao = (id) => {
    persistRestricoes(restricoes.filter((r) => r.id !== id));
    Object.entries(weeks).forEach(([wkk, ts]) => {
      const patched = ts.map((t) => (t.restricaoId === id ? { ...t, restricaoId: null } : t));
      if (JSON.stringify(patched) !== JSON.stringify(ts)) {
        setWeeks((prev) => ({ ...prev, [wkk]: patched }));
        api && api.setWeek(wkk, patched);
      }
    });
  };

  const restricaoAbertaMap = useMemo(() => {
    const m = {}; restricoes.forEach((r) => { m[r.id] = r.status === "aberta"; }); return m;
  }, [restricoes]);
  const openCount = restricoes.filter((r) => r.status === "aberta").length;

  const allWeekKeys = useMemo(() => Object.keys(weeks).sort(), [weeks]);
  const ppcHistory = useMemo(() => allWeekKeys.map((k) => {
    const ts = weeks[k] || [];
    const total = ts.length, done = ts.filter((t) => t.status === "concluida").length;
    return { week: k, label: isoWeekLabel(new Date(k)), ppc: total > 0 ? Math.round((done/total)*100) : null, total, done };
  }).filter((w) => w.total > 0), [weeks, allWeekKeys]);

  const causaPareto = useMemo(() => {
    const counts = {};
    allWeekKeys.forEach((k) => (weeks[k]||[]).forEach((t) => {
      if (t.status === "nao_concluida" && t.causa) counts[t.causa] = (counts[t.causa]||0)+1;
    }));
    return Object.entries(counts).map(([causa,count])=>({causa,count})).sort((a,b)=>b.count-a.count);
  }, [weeks, allWeekKeys]);

  const rankFromTasks = (ts, field) => {
    const by = {};
    ts.forEach((t) => {
      const key = t[field] || "—";
      if (!by[key]) by[key] = { total:0, done:0 };
      by[key].total += 1; if (t.status === "concluida") by[key].done += 1;
    });
    return Object.entries(by).map(([name,v])=>({name, ppc: v.total>0?Math.round((v.done/v.total)*100):0, total:v.total})).filter(r=>r.total>0).sort((a,b)=>b.ppc-a.ppc);
  };
  const rankingBy = (field) => {
    const by = {};
    allWeekKeys.forEach((k) => (weeks[k]||[]).forEach((t) => {
      const key = t[field] || "—";
      if (!by[key]) by[key] = { total:0, done:0 };
      by[key].total += 1; if (t.status === "concluida") by[key].done += 1;
    }));
    return Object.entries(by).map(([name,v])=>({name, ppc: v.total>0?Math.round((v.done/v.total)*100):0, total:v.total})).filter(r=>r.total>0).sort((a,b)=>b.ppc-a.ppc);
  };
  const rankingEquipe = useMemo(() => rankingBy("equipe"), [weeks, allWeekKeys]);
  const rankingEncarregado = useMemo(() => rankingBy("encarregado"), [weeks, allWeekKeys]);

  const weekTotal = tasks.length;
  const weekDone = tasks.filter((t) => t.status === "concluida").length;
  const weekNotDone = tasks.filter((t) => t.status === "nao_concluida").length;
  const weekPPC = weekTotal > 0 ? Math.round((weekDone/weekTotal)*100) : null;

  if (checkingAccess) {
    return <div className="min-h-screen flex items-center justify-center bg-neutral-950"><img src={MASN_ICON} className="w-12 h-12 animate-pulse" /></div>;
  }

  if (!unlocked) {
    return <LoginGate correctPassword={accessPassword} onUnlock={() => setUnlocked(true)} />;
  }

  if (loading) {
    return <div className="min-h-screen flex flex-col items-center justify-center gap-4 bg-neutral-950 text-neutral-500 text-sm"><img src={MASN_ICON} className="w-12 h-12 animate-pulse" />Carregando PCP...</div>;
  }

  if (!activeObraId) {
    return <EmptyObraScreen createObra={createObra} />;
  }

  return (
    <div className="min-h-screen bg-neutral-950 text-neutral-100 font-sans">
      <div className="sticky top-0 z-20">
        <Header saving={saving} obra={obra} />
        <TabBar tab={tab} setTab={setTab} openCount={openCount} />
      </div>
      <main className="max-w-6xl mx-auto px-4 pb-24 pt-4">
        {tab === "restricoes" && (
          <Restricoes restricoes={restricoes} obra={obra} patchRestricao={patchRestricao} removeRestricao={removeRestricao} />
        )}
        {tab === "planejamento" && (
          <Planejamento currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} tasks={tasks}
            setores={setores} encarregados={encarregados} equipes={equipes}
            restricoes={restricoes} restricaoAbertaMap={restricaoAbertaMap}
            addRestricao={addRestricao} patchRestricao={patchRestricao}
            addTask={addTask} removeTask={removeTask} patchTask={patchTask}
            weekPPC={weekPPC} weekTotal={weekTotal} weekDone={weekDone} weekNotDone={weekNotDone} />
        )}
        {tab === "check" && (
          <CheckDiario currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} tasks={tasks}
            patchTask={patchTask} restricaoAbertaMap={restricaoAbertaMap} />
        )}
        {tab === "dashboard" && (
          <Dashboard ppcHistory={ppcHistory} causaPareto={causaPareto} rankingEquipe={rankingEquipe}
            rankingEncarregado={rankingEncarregado} weekTasks={tasks} weekPPC={weekPPC}
            currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} restricoes={restricoes}
            rankFromTasks={rankFromTasks} />
        )}
        {tab === "config" && (
          <Config setores={setores} encarregados={encarregados} equipes={equipes}
            addSetor={addSetor} addEncarregado={addEncarregado} addEquipe={addEquipe}
            removeSetor={removeSetor} removeEncarregado={removeEncarregado} removeEquipe={removeEquipe}
            obra={obra} updateObra={updateObra}
            obras={obras} activeObraId={activeObraId} switchObra={switchObra} createObra={createObra} removeObra={removeObra}
            accessPassword={accessPassword} updatePassword={updatePassword} />
        )}
      </main>
    </div>
  );
}

function LoginGate({ correctPassword, onUnlock }) {
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState(false);
  const [verSenha, setVerSenha] = useState(false);
  const submit = () => { if (senha === correctPassword) onUnlock(); else setErro(true); };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-5 bg-neutral-950 text-neutral-100 px-6">
      <img src={MASN_ICON} className="w-14 h-14" />
      <div className="text-center">
        <div className="text-base font-bold">PCP MASN</div>
        <div className="text-[12.5px] text-neutral-500 mt-1 max-w-xs">Acesso restrito à equipe MASN. Digite a senha compartilhada pra entrar.</div>
      </div>
      <div className="w-full max-w-xs space-y-2">
        <div className="relative">
          <input type={verSenha ? "text" : "password"} value={senha}
            onChange={(e)=>{setSenha(e.target.value); setErro(false);}}
            onKeyDown={(e)=>e.key==="Enter" && submit()}
            placeholder="Senha de acesso"
            className="w-full bg-neutral-900 border rounded-md px-3 py-2.5 pr-16 text-sm outline-none"
            style={{borderColor: erro?RED:"#404040"}} autoFocus />
          <button onClick={()=>setVerSenha(v=>!v)} className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-neutral-500">{verSenha?"ocultar":"ver"}</button>
        </div>
        {erro && <div className="text-[11px]" style={{color:RED}}>Senha incorreta. Confira com o Miguel.</div>}
        <button onClick={submit} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2.5 text-sm font-semibold" style={{background:ORANGE,color:BLACK}}>
          <ILock size={15}/> Entrar
        </button>
      </div>
      <img src={MASN_WORDMARK} className="h-8 opacity-50 mt-2" />
    </div>
  );
}

      </div>

          placeholder="Nome da obra (ex: Constance Camaçari)"

        <button onClick={submit} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2.5 text-sm font-semibold" style={{background:ORANGE,color:BLACK}}>

/* ---------------- Restrições ---------------- */
function PrintReport({ restricoes, obra, onClose }) {
  const now = new Date();
  const grupos = CATEGORIAS_RESTRICAO.map((categoria) => ({
    categoria,
    itens: restricoes.filter((r)=>(r.categoria||"Outro")===categoria)
      .sort((a,b)=>(a.status==="aberta"?0:1)-(b.status==="aberta"?0:1) || (a.prazo||"9999").localeCompare(b.prazo||"9999")),
  })).filter((g)=>g.itens.length>0);
  const totalAbertas = restricoes.filter((r)=>r.status==="aberta").length;
  return (
    <div className="mb-6 border-2 rounded-lg overflow-hidden" style={{borderColor:AMBER}}>
      <div className="flex items-center justify-between px-3 py-2" style={{background:AMBER}}>
        <div className="text-[12px] font-bold" style={{color:BLACK}}>Prévia do relatório</div>
        <div className="flex items-center gap-2">
          <button onClick={()=>window.print()} className="text-[11px] font-semibold px-2.5 py-1 rounded-md flex items-center gap-1" style={{background:BLACK,color:"#fff"}}><IFileText size={11}/> Imprimir / Salvar PDF</button>
          <button onClick={onClose} className="p-1 rounded-md" style={{color:BLACK}}><IX size={15}/></button>
        </div>
      </div>
      <div style={{maxHeight:480, overflowY:"auto", background:"#fff", color:"#111", padding:"8mm", fontFamily:"Arial, sans-serif"}}>
        <div style={{display:"flex",justifyContent:"space-between",borderBottom:"2px solid #111",paddingBottom:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:18,fontWeight:800}}>Relatório de Restrições</div>
            <div style={{fontSize:12,color:"#444",marginTop:2}}>{[obra?.nome,obra?.local].filter(Boolean).join(" · ")||"Obra não identificada"}</div>
          </div>
          <div style={{textAlign:"right",fontSize:10.5,color:"#555"}}>
            <div>Gerado em {now.toLocaleString("pt-BR")}</div>
            <div>Total: {restricoes.length} · Abertas: {totalAbertas}</div>
          </div>
        </div>
        {grupos.map((g)=>(
          <div key={g.categoria} style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,background:"#eee",padding:"4px 8px",marginBottom:4}}>{g.categoria} — {g.itens.length}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10.5}}>
              <thead><tr style={{borderBottom:"1px solid #999",textAlign:"left"}}>
                <th style={{padding:"3px 6px"}}>Descrição</th><th style={{padding:"3px 6px"}}>Setor</th>
                <th style={{padding:"3px 6px"}}>Responsável</th><th style={{padding:"3px 6px"}}>Prazo</th><th style={{padding:"3px 6px"}}>Status</th>
              </tr></thead>
              <tbody>{g.itens.map((r)=>(
                <tr key={r.id} style={{borderBottom:"1px solid #ddd"}}>
                  <td style={{padding:"3px 6px"}}>{r.descricao}</td><td style={{padding:"3px 6px"}}>{r.setor}</td>
                  <td style={{padding:"3px 6px"}}>{r.responsavelLiberar||"—"}</td><td style={{padding:"3px 6px"}}>{fmtDateFull(r.prazo)||"—"}</td>
                  <td style={{padding:"3px 6px",fontWeight:700,color:r.status==="aberta"?"#a11":"#1a7a3c"}}>{r.status==="aberta"?"Aberta":"Liberada"}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        ))}
      </div>
    </div>
  );
}
function Restricoes({ restricoes, obra, patchRestricao, removeRestricao }) {
  const [showPreview, setShowPreview] = useState(false);
  const abertas = restricoes.filter((r)=>r.status==="aberta").sort((a,b)=>(a.prazo||"9999").localeCompare(b.prazo||"9999"));
  const liberadas = restricoes.filter((r)=>r.status!=="aberta");
  const today = new Date().toISOString().slice(0,10);
  return (
    <div>
      <div className="text-[12px] text-neutral-500 mb-4 leading-relaxed bg-neutral-900 border border-neutral-800 rounded-lg p-3">
        A base do nosso sistema é eliminar as <b className="text-neutral-300">restrições</b> para que o fluxo de obra não seja impactado.
        Restrições são registradas junto com o lançamento do compromisso, na aba <b className="text-neutral-300">Planejamento</b>. Aqui você só acompanha e libera o que já foi resolvido.
      </div>
      {!showPreview ? (
        <button onClick={()=>setShowPreview(true)} disabled={restricoes.length===0}
          className="w-full mb-4 flex items-center justify-center gap-1.5 rounded-md py-2.5 text-sm font-semibold border"
          style={{borderColor:restricoes.length===0?"#333":AMBER, color:restricoes.length===0?"#555":AMBER, opacity:restricoes.length===0?0.6:1}}>
          <IFileText size={15}/> Ver relatório (por tipo de restrição)
        </button>
      ) : <PrintReport restricoes={restricoes} obra={obra} onClose={()=>setShowPreview(false)} />}
      <div className="mb-6">
        <div className="text-xs font-bold text-neutral-500 uppercase tracking-wide mb-2 flex items-center gap-1.5"><ILock size={12}/> Abertas ({abertas.length})</div>
        {abertas.length===0 ? <div className="text-sm text-neutral-600 italic">Nenhuma restrição aberta.</div> : (
          <div className="space-y-1.5">
            {abertas.map((r)=>{
              const vencida = r.prazo && r.prazo<today;
              return (
                <div key={r.id} className="bg-neutral-900 border rounded-md px-3 py-2.5" style={{borderColor:vencida?RED:"#262626"}}>
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="text-sm">{r.descricao}</div>
                      <div className="text-[11px] text-neutral-500 flex flex-wrap gap-x-2 mt-0.5">
                        <span>{r.categoria}</span><span>· {r.setor}</span>
                        {r.responsavelLiberar && <span>· {r.responsavelLiberar}</span>}
                        {r.prazo && <span style={{color:vencida?RED:undefined}}>· prazo {fmtDate(r.prazo)}{vencida?" (vencida)":""}</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={()=>patchRestricao(r.id,{status:"liberada"})} className="text-[11px] font-semibold px-2 py-1.5 rounded-md flex items-center gap-1" style={{background:GREEN,color:"#fff"}}><IUnlock size={11}/> Liberar</button>
                      <button onClick={()=>removeRestricao(r.id)} className="p-1.5 text-neutral-600 hover:text-red-400"><ITrash size={13}/></button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {liberadas.length>0 && (
        <div>
          <div className="text-xs font-bold text-neutral-500 uppercase tracking-wide mb-2 flex items-center gap-1.5"><IUnlock size={12}/> Liberadas ({liberadas.length})</div>
          <div className="space-y-1.5 opacity-60">
            {liberadas.map((r)=>(
              <div key={r.id} className="bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2 flex items-center justify-between">
                <div className="text-sm line-through">{r.descricao}</div>
                <button onClick={()=>removeRestricao(r.id)} className="p-1 text-neutral-600 hover:text-red-400"><ITrash size={13}/></button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Planejamento ---------------- */
function Planejamento({ currentMonday, setCurrentMonday, tasks, setores, encarregados, equipes,
  restricoes, restricaoAbertaMap, addRestricao, patchRestricao, addTask, removeTask, patchTask,
  weekPPC, weekTotal, weekDone, weekNotDone }) {
  const defaultForm = () => ({ descricao:"", setor:setores[0], diaInicio:0, diaFim:0, encarregado:"", equipe:"" });
  const defaultRestForm = () => ({ tipo:CATEGORIAS_RESTRICAO[0], descricao:"", responsavel:"", dia:"" });
  const [form, setForm] = useState(defaultForm());
  const [temRestricao, setTemRestricao] = useState(false);
  const [restForm, setRestForm] = useState(defaultRestForm());
  const [tentouSemEquipe, setTentouSemEquipe] = useState(false);
  const [tentouSemEncarregado, setTentouSemEncarregado] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (t) => {
    setEditingId(t.id);
    setForm({ descricao:t.descricao, setor:t.setor, diaInicio:t.diaInicio, diaFim:t.diaFim, encarregado:t.encarregado, equipe:t.equipe });
    const linked = t.restricaoId ? restricoes.find((r)=>r.id===t.restricaoId) : null;
    if (linked) { setTemRestricao(true); setRestForm({tipo:linked.categoria, descricao:linked.descricao, responsavel:linked.responsavelLiberar||"", dia:linked.prazo||""}); }
    else { setTemRestricao(false); setRestForm(defaultRestForm()); }
    window.scrollTo({top:0, behavior:"smooth"});
  };
  const cancelEdit = () => { setEditingId(null); setForm(defaultForm()); setTemRestricao(false); setRestForm(defaultRestForm()); setTentouSemEquipe(false); setTentouSemEncarregado(false); };

  const submit = () => {
    if (!form.descricao.trim()) return;
    let bloqueado = false;
    if (!form.encarregado) { setTentouSemEncarregado(true); bloqueado = true; }
    if (!form.equipe) { setTentouSemEquipe(true); bloqueado = true; }
    if (bloqueado) return;
    const diaFim = Math.max(form.diaInicio, form.diaFim);
    const editingTask = editingId ? tasks.find((t)=>t.id===editingId) : null;
    let restricaoId = editingTask ? editingTask.restricaoId : null;
    if (temRestricao && restForm.descricao.trim()) {
      if (restricaoId) patchRestricao(restricaoId, { categoria:restForm.tipo, descricao:restForm.descricao, setor:form.setor, responsavelLiberar:restForm.responsavel, prazo:restForm.dia });
      else restricaoId = addRestricao({ categoria:restForm.tipo, descricao:restForm.descricao, setor:form.setor, responsavelLiberar:restForm.responsavel, prazo:restForm.dia });
    } else restricaoId = null;
    if (editingId) patchTask(editingId, { ...form, diaFim, restricaoId });
    else addTask({ ...form, diaFim, restricaoId });
    setEditingId(null); setForm(defaultForm()); setTemRestricao(false); setTentouSemEquipe(false); setTentouSemEncarregado(false); setRestForm(defaultRestForm());
  };

  const sorted = [...tasks].sort((a,b)=>a.diaInicio-b.diaInicio||a.diaFim-b.diaFim);
  const comRestricaoAberta = tasks.filter((t)=>t.restricaoId && restricaoAbertaMap[t.restricaoId]).length;

  return (
    <div>
      <WeekNav currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} />
      <div className="grid grid-cols-4 gap-2 mb-3">
        <StatCard label="Compromissos" value={weekTotal} />
        <StatCard label="Concluídos" value={weekDone} color={GREEN} />
        <StatCard label="Não concluídos" value={weekNotDone} color={RED} />
        <StatCard label="PPC" value={weekPPC===null?"—":`${weekPPC}%`} color={ORANGE} />
      </div>
      {comRestricaoAberta>0 && (
        <div className="mb-4 text-[12px] flex items-center gap-1.5 bg-red-950/40 border border-red-900 text-red-300 rounded-md px-3 py-2">
          <IAlert size={13}/> {comRestricaoAberta} compromisso{comRestricaoAberta>1?"s":""} desta semana ainda {comRestricaoAberta>1?"têm":"tem"} restrição aberta.
        </div>
      )}
      <div className="bg-neutral-900 border rounded-lg p-4 mb-6" style={{borderColor:editingId?ORANGE:"#262626"}}>
        <div className="flex items-center justify-between mb-3">
          <div className="text-xs font-semibold text-neutral-400 uppercase tracking-wide">{editingId?"Editando compromisso":"Novo compromisso"}</div>
          {editingId && <button onClick={cancelEdit} className="text-[11px] text-neutral-500 hover:text-neutral-300 flex items-center gap-1"><IX size={12}/> Cancelar edição</button>}
        </div>
        <div className="space-y-2.5">
          <input value={form.descricao} onChange={(e)=>setForm(f=>({...f,descricao:e.target.value}))}
            placeholder="O que vai ser entregue? (ex: forro drywall térreo — 2ª demão)"
            className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none focus:border-orange-500" />
          <select value={form.setor} onChange={(e)=>setForm(f=>({...f,setor:e.target.value}))} className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-2 py-2 text-sm outline-none">
            {setores.map((s)=><option key={s}>{s}</option>)}
          </select>
          <div>
            <div className="text-[11px] text-neutral-500 mb-1">Período de execução</div>
            <div className="grid grid-cols-2 gap-2">
              <select value={form.diaInicio} onChange={(e)=>{const v=Number(e.target.value);setForm(f=>({...f,diaInicio:v,diaFim:Math.max(v,f.diaFim)}));}} className="bg-neutral-950 border border-neutral-700 rounded-md px-2 py-2 text-sm outline-none">
                {DAYS.map((d,i)=><option key={d} value={i}>Início: {d}</option>)}
              </select>
              <select value={form.diaFim} onChange={(e)=>setForm(f=>({...f,diaFim:Number(e.target.value)}))} className="bg-neutral-950 border border-neutral-700 rounded-md px-2 py-2 text-sm outline-none">
                {DAYS.map((d,i)=><option key={d} value={i} disabled={i<form.diaInicio}>Fim: {d}</option>)}
              </select>
            </div>
          </div>
          <div>
            <div className="text-[11px] text-neutral-500 mb-1">Responsabilidade</div>
            <div className="grid grid-cols-2 gap-2">
              <select value={form.encarregado} onChange={(e)=>{setForm(f=>({...f,encarregado:e.target.value}));setTentouSemEncarregado(false);}}
                className="bg-neutral-950 border rounded-md px-2 py-2 text-sm outline-none" style={{color:form.encarregado?undefined:"#666",borderColor:tentouSemEncarregado?RED:"#404040"}}>
                <option value="" disabled>Selecione o encarregado</option>
                {encarregados.map((r)=><option key={r}>{r}</option>)}
              </select>
              <select value={form.equipe} onChange={(e)=>{setForm(f=>({...f,equipe:e.target.value}));setTentouSemEquipe(false);}}
                className="bg-neutral-950 border rounded-md px-2 py-2 text-sm outline-none" style={{color:form.equipe?undefined:"#666",borderColor:tentouSemEquipe?RED:"#404040"}}>
                <option value="" disabled>Selecione a equipe</option>
                {equipes.map((r)=><option key={r}>{r}</option>)}
              </select>
            </div>
            {(tentouSemEncarregado||tentouSemEquipe) && (
              <div className="text-[10.5px] mt-1" style={{color:RED}}>
                {tentouSemEncarregado&&tentouSemEquipe?"Selecione o encarregado e a equipe.":tentouSemEncarregado?"Selecione o encarregado.":"Selecione a equipe que vai executar."}
              </div>
            )}
            <div className="flex gap-6 mt-1 text-[10px] text-neutral-600">
              <span className="flex items-center gap-1"><IUser size={10}/> encarregado (cobra o resultado)</span>
              <span className="flex items-center gap-1"><IUsers size={10}/> equipe (executa)</span>
            </div>
          </div>
          <div className="pt-1">
            <label className="flex items-center gap-2 text-[12px] text-neutral-300 cursor-pointer select-none">
              <input type="checkbox" checked={temRestricao} onChange={(e)=>setTemRestricao(e.target.checked)} className="accent-orange-500" />
              <IShield size={13}/> Essa atividade tem restrição a resolver antes de comprometer?
            </label>
          </div>
          {temRestricao && (
            <div className="bg-neutral-950 border border-red-900/50 rounded-md p-3 space-y-2.5">
              <select value={restForm.tipo} onChange={(e)=>setRestForm(f=>({...f,tipo:e.target.value}))} className="w-full bg-neutral-900 border border-neutral-700 rounded-md px-2 py-2 text-sm outline-none">
                {CATEGORIAS_RESTRICAO.map((c)=><option key={c}>{c}</option>)}
              </select>
              <input value={restForm.descricao} onChange={(e)=>setRestForm(f=>({...f,descricao:e.target.value}))} placeholder="Descreva a restrição (ex: entrega do granito da escada)" className="w-full bg-neutral-900 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
              <div className="grid grid-cols-2 gap-2">
                <input value={restForm.responsavel} onChange={(e)=>setRestForm(f=>({...f,responsavel:e.target.value}))} placeholder="Responsável por resolver" className="bg-neutral-900 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
                <input type="date" value={restForm.dia} onChange={(e)=>setRestForm(f=>({...f,dia:e.target.value}))} className="bg-neutral-900 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
              </div>
              <div className="text-[10.5px]" style={{color:RED}}>O compromisso vai ficar sinalizado como restrito até você liberar essa restrição na aba Restrições.</div>
            </div>
          )}
          <button onClick={submit} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold" style={{background:ORANGE,color:BLACK}}>
            <IPlus size={15}/> {editingId?"Salvar alterações":"Adicionar compromisso"}
          </button>
        </div>
      </div>
      {sorted.length===0 ? <div className="text-sm text-neutral-500 text-center py-10">Nenhum compromisso cadastrado ainda.</div> : (
        <div className="space-y-1.5">
          {sorted.map((t)=>(
            <div key={t.id} className="flex items-start justify-between bg-neutral-900 border rounded-md px-3 py-2.5" style={{borderColor:editingId===t.id?ORANGE:"#262626"}}>
              <div className="min-w-0 flex gap-3 items-start">
                <div className="text-[11px] font-bold text-neutral-400 bg-neutral-800 rounded px-1.5 py-1 shrink-0 mt-0.5">{periodoLabel(t.diaInicio,t.diaFim)}</div>
                <div className="min-w-0">
                  <div className="text-sm truncate">{t.descricao}</div>
                  <div className="text-[11px] text-neutral-500 flex items-center gap-2 flex-wrap">
                    <span>{t.setor}</span>
                    <span className="flex items-center gap-0.5"><IUser size={10}/>{t.encarregado}</span>
                    <span className="flex items-center gap-0.5"><IUsers size={10}/>{t.equipe}</span>
                  </div>
                  <ConstraintBadge task={t} restricoes={restricoes} restricaoAbertaMap={restricaoAbertaMap} />
                </div>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={()=>startEdit(t)} className="p-1 text-neutral-600 hover:text-orange-400"><IPencil size={14}/></button>
                <button onClick={()=>removeTask(t.id)} className="p-1 text-neutral-600 hover:text-red-400"><ITrash size={14}/></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Check diário ---------------- */
function CheckDiario({ currentMonday, setCurrentMonday, tasks, patchTask, restricaoAbertaMap }) {
  const mark = (t, status) => { if (status==="nao_concluida") patchTask(t.id,{status}); else patchTask(t.id,{status,causa:""}); };
  const sorted = [...tasks].sort((a,b)=>a.diaInicio-b.diaInicio||a.diaFim-b.diaFim);
  return (
    <div>
      <WeekNav currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} />
      {tasks.length===0 && <div className="text-sm text-neutral-500 text-center py-10">Nenhum compromisso cadastrado para essa semana ainda.<br/>Vá em "Planejamento" para adicionar.</div>}
      <div className="space-y-1.5">
        {sorted.map((t)=>{
          const restrito = t.restricaoId && restricaoAbertaMap[t.restricaoId];
          return (
            <div key={t.id} className="bg-neutral-900 border rounded-md p-2.5" style={{borderColor:restrito?RED:"#262626"}}>
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0 flex gap-3 items-start">
                  <div className="text-[11px] font-bold text-neutral-400 bg-neutral-800 rounded px-1.5 py-1 shrink-0 mt-0.5">{periodoLabel(t.diaInicio,t.diaFim)}</div>
                  <div className="min-w-0">
                    <div className="text-sm">{t.descricao}</div>
                    <div className="text-[11px] text-neutral-500 flex items-center gap-2 flex-wrap">
                      <span>{t.setor}</span>
                      <span className="flex items-center gap-0.5"><IUser size={10}/>{t.encarregado}</span>
                      <span className="flex items-center gap-0.5"><IUsers size={10}/>{t.equipe}</span>
                    </div>
                    {restrito && <div className="mt-1 flex items-center gap-1 text-[10.5px] font-semibold" style={{color:RED}}><ILock size={11}/> Restrição ainda aberta</div>}
                  </div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <button onClick={()=>mark(t,"concluida")} className="w-8 h-8 rounded-md flex items-center justify-center border" style={{background:t.status==="concluida"?GREEN:"transparent",borderColor:t.status==="concluida"?GREEN:"#404040"}}><ICheck size={15} color={t.status==="concluida"?"#fff":"#666"}/></button>
                  <button onClick={()=>mark(t,"nao_concluida")} className="w-8 h-8 rounded-md flex items-center justify-center border" style={{background:t.status==="nao_concluida"?RED:"transparent",borderColor:t.status==="nao_concluida"?RED:"#404040"}}><IX size={15} color={t.status==="nao_concluida"?"#fff":"#666"}/></button>
                </div>
              </div>
              {t.status==="nao_concluida" && (
                <div className="mt-2 pt-2 border-t border-neutral-800">
                  <div className="text-[11px] text-neutral-500 mb-1 flex items-center gap-1"><IAlert size={11}/> Causa do não cumprimento</div>
                  <select value={t.causa||""} onChange={(e)=>patchTask(t.id,{causa:e.target.value})} className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-2 py-1.5 text-xs outline-none">
                    <option value="">Selecione...</option>
                    {CAUSAS.map((c)=><option key={c}>{c}</option>)}
                  </select>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
function RankingBlock({ data }) {
  return (
    <div className="space-y-1.5">
      {data.map((r,i)=>(
        <div key={r.name} className="flex items-center gap-3 bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2">
          <div className="text-xs text-neutral-600 w-4">{i+1}</div>
          <div className="flex-1 min-w-0">
            <div className="text-sm truncate">{r.name}</div>
            <div className="w-full h-1.5 bg-neutral-800 rounded-full mt-1 overflow-hidden">
              <div className="h-full rounded-full" style={{width:`${r.ppc}%`, background:r.ppc>=80?GREEN:r.ppc>=60?ORANGE:RED}}/>
            </div>
          </div>
          <div className="text-sm font-bold w-12 text-right">{r.ppc}%</div>
        </div>
      ))}
    </div>
  );
}
function Dashboard({ ppcHistory, causaPareto, rankingEquipe, rankingEncarregado, weekTasks, weekPPC, currentMonday, setCurrentMonday, restricoes, rankFromTasks }) {
  const rankingEquipeSemana = useMemo(()=>rankFromTasks(weekTasks,"equipe"), [weekTasks]);
  const rankingEncarregadoSemana = useMemo(()=>rankFromTasks(weekTasks,"encarregado"), [weekTasks]);
  const isRealCurrentWeek = weekKey(currentMonday) === weekKey(mondayOf(new Date()));
  const restricaoPorTipo = useMemo(() => {
    const by = {};
    restricoes.forEach((r)=>{ const key=r.categoria||"Outro"; if(!by[key]) by[key]={total:0,liberadas:0}; by[key].total+=1; if(r.status!=="aberta") by[key].liberadas+=1; });
    return CATEGORIAS_RESTRICAO.map((categoria)=>{ const v=by[categoria]; if(!v) return null; return {name:categoria, ppc:Math.round((v.liberadas/v.total)*100), total:v.total, liberadas:v.liberadas}; }).filter(Boolean).sort((a,b)=>b.total-a.total);
  }, [restricoes]);
  const todayMonday = mondayOf(new Date());
  const latestDataMonday = ppcHistory.length>0 ? new Date(Math.max(...ppcHistory.map((w)=>new Date(w.week).getTime()))) : todayMonday;
  const maxMonday = latestDataMonday > todayMonday ? latestDataMonday : todayMonday;

  if (ppcHistory.length===0 && weekTasks.length===0 && restricoes.length===0) {
    return <div className="text-sm text-neutral-500 text-center py-16">Ainda não há dados suficientes.<br/>Registre compromissos e faça o check diário por pelo menos uma semana para ver o painel.</div>;
  }
  const avgPPC = ppcHistory.length>0 ? Math.round(ppcHistory.reduce((s,w)=>s+(w.ppc||0),0)/ppcHistory.length) : null;

  return (
    <div className="space-y-6">
      <div>
        <WeekNav currentMonday={currentMonday} setCurrentMonday={setCurrentMonday} maxMonday={maxMonday} />
        {!isRealCurrentWeek && <button onClick={()=>setCurrentMonday(mondayOf(new Date()))} className="text-[11px] mb-3 underline" style={{color:ORANGE}}>← voltar para a semana atual</button>}
      </div>
      <SectionBlock color={ORANGE} title={isRealCurrentWeek?"PPC — semana atual":`PPC — semana de ${isoWeekLabel(currentMonday)}`}>
        <div className="rounded-lg px-4 py-5 text-center border" style={{background:"#1a1a1a",borderColor:ORANGE}}>
          <div className="text-4xl font-black" style={{color:ORANGE}}>{weekPPC===null?"—":`${weekPPC}%`}</div>
          <div className="text-[11px] text-neutral-500 mt-1">meta: 80–90%</div>
        </div>
      </SectionBlock>
      <SectionBlock color={BLUE} title="Histórico geral">
        <div className="grid grid-cols-2 gap-2.5 mb-3">
          <StatCard label="PPC médio (histórico)" value={avgPPC===null?"—":`${avgPPC}%`} color={BLUE} />
          <StatCard label="Faixa alvo" value="80–90%" color={avgPPC===null?undefined:(avgPPC>=80&&avgPPC<=90?GREEN:avgPPC<80?RED:AMBER)} />
        </div>
        {ppcHistory.length>0 && (
          <div>
            <div className="bg-neutral-900 border border-neutral-800 rounded-lg p-3"><SimpleLineChart data={ppcHistory} color={BLUE} /></div>
            <div className="text-[11px] text-neutral-500 mt-1">Faixa tracejada = meta (80–90%).</div>
          </div>
        )}
      </SectionBlock>
      {causaPareto.length>0 && (
        <SectionBlock color={RED} title="Causas de não cumprimento (Pareto, histórico)">
          <div className="bg-neutral-900 border border-neutral-800 rounded-lg p-3">
            <SimpleBarChartH data={causaPareto} colorFor={(i)=>i===0?RED:i===1?ORANGE:"#5B5B5B"} />
          </div>
        </SectionBlock>
      )}
      {restricaoPorTipo.length>0 && (
        <SectionBlock color={AMBER} title="Restrições liberadas por tipo">
          <div className="space-y-1.5">
            {restricaoPorTipo.map((r)=>(
              <div key={r.name} className="flex items-center gap-3 bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2">
                <div className="flex-1 min-w-0">
                  <div className="text-sm flex items-center justify-between"><span>{r.name}</span><span className="text-[11px] text-neutral-500">{r.liberadas}/{r.total}</span></div>
                  <div className="w-full h-1.5 bg-neutral-800 rounded-full mt-1 overflow-hidden"><div className="h-full rounded-full" style={{width:`${r.ppc}%`, background:r.ppc>=80?GREEN:r.ppc>=40?AMBER:RED}}/></div>
                </div>
                <div className="text-sm font-bold w-12 text-right">{r.ppc}%</div>
              </div>
            ))}
          </div>
        </SectionBlock>
      )}
      <SectionBlock color={PURPLE} title={`Equipe — ${isRealCurrentWeek?"esta semana":"semana selecionada"}`}>
        {rankingEquipeSemana.length>0 ? <RankingBlock data={rankingEquipeSemana}/> : <div className="text-sm text-neutral-600 italic">Sem compromissos nesta semana.</div>}
      </SectionBlock>
      {rankingEquipe.length>0 && <SectionBlock color={PURPLE} title="Equipe — média histórica" subdued><RankingBlock data={rankingEquipe}/></SectionBlock>}
      <SectionBlock color={TEAL} title={`Encarregado — ${isRealCurrentWeek?"esta semana":"semana selecionada"}`}>
        {rankingEncarregadoSemana.length>0 ? <RankingBlock data={rankingEncarregadoSemana}/> : <div className="text-sm text-neutral-600 italic">Sem compromissos nesta semana.</div>}
      </SectionBlock>
      {rankingEncarregado.length>0 && <SectionBlock color={TEAL} title="Encarregado — média histórica" subdued><RankingBlock data={rankingEncarregado}/></SectionBlock>}
    </div>
  );
}

/* ---------------- Config ---------------- */
function ConfigList({ title, items, value, setValue, onAdd, onRemove, placeholder }) {
  return (
    <div>
      <div className="text-xs font-bold text-neutral-500 uppercase tracking-wide mb-2">{title}</div>
      <div className="flex flex-wrap gap-1.5 mb-2.5">
        {items.map((s)=>(
          <span key={s} className="flex items-center gap-1 text-xs bg-neutral-900 border border-neutral-800 rounded-full pl-2.5 pr-1.5 py-1">
            {s}<button onClick={()=>onRemove(s)} className="text-neutral-600 hover:text-red-400 p-0.5 rounded-full"><IX size={11}/></button>
          </span>
        ))}
        {items.length===0 && <span className="text-xs text-neutral-600 italic">Nenhum item cadastrado.</span>}
      </div>
      <div className="flex gap-2">
        <input value={value} onChange={(e)=>setValue(e.target.value)} placeholder={placeholder} className="flex-1 bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
        <button onClick={onAdd} className="px-3 rounded-md text-sm font-semibold" style={{background:ORANGE,color:BLACK}}>Adicionar</button>
      </div>
    </div>
  );
}
function Config({ setores, encarregados, equipes, addSetor, addEncarregado, addEquipe, removeSetor, removeEncarregado, removeEquipe,
  obra, updateObra, obras, activeObraId, switchObra, createObra, removeObra, accessPassword, updatePassword }) {
  const [novoSetor, setNovoSetor] = useState("");
  const [novoEnc, setNovoEnc] = useState("");
  const [novaEquipe, setNovaEquipe] = useState("");
  const [novaObraNome, setNovaObraNome] = useState("");
  const [mostrarNovaObra, setMostrarNovaObra] = useState(false);
  const [confirmarExclusao, setConfirmarExclusao] = useState(false);
  const [draftObra, setDraftObra] = useState(obra || {nome:"",local:"",engenheiro:"",entrega:""});
  const [dirty, setDirty] = useState(false);
  const [novaSenha, setNovaSenha] = useState("");
  const [senhaSalva, setSenhaSalva] = useState(false);

  useEffect(()=>{ setDraftObra(obra); setDirty(false); setConfirmarExclusao(false); }, [obra]);

  const patchDraft = (patch) => { setDraftObra((d)=>({...d,...patch})); setDirty(true); };
  const salvarObra = () => { updateObra(draftObra); setDirty(false); };
  const cancelarObra = () => { setDraftObra(obra); setDirty(false); };

  return (
    <div className="space-y-6">
      <SectionBlock color={BLUE} title="Obra ativa">
        <div className="bg-neutral-900 border border-neutral-800 rounded-lg p-4 space-y-2.5">
          <select value={activeObraId||""} onChange={(e)=>switchObra(e.target.value)} className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none">
            {obras.map((o)=><option key={o.id} value={o.id}>{o.nome}</option>)}
          </select>
          {!confirmarExclusao ? (
            <button onClick={()=>setConfirmarExclusao(true)} className="text-[11px] text-neutral-600 hover:text-red-400 flex items-center gap-1"><ITrash size={11}/> Excluir esta obra</button>
          ) : (
            <div className="flex items-center gap-2 bg-red-950/40 border border-red-900 rounded-md px-2.5 py-2">
              <div className="text-[11px] text-red-300 flex-1">Excluir "{obra?.nome}"? Essa ação não pode ser desfeita.</div>
              <button onClick={()=>{removeObra(activeObraId);setConfirmarExclusao(false);}} className="text-[11px] font-semibold px-2 py-1 rounded" style={{background:RED,color:"#fff"}}>Excluir</button>
              <button onClick={()=>setConfirmarExclusao(false)} className="text-[11px] px-2 py-1 rounded border border-neutral-700 text-neutral-400">Cancelar</button>
            </div>
          )}
          {!mostrarNovaObra ? (
            <button onClick={()=>setMostrarNovaObra(true)} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold border" style={{borderColor:BLUE,color:BLUE}}><IPlus size={15}/> Nova obra</button>
          ) : (
            <div className="flex gap-2">
              <input value={novaObraNome} onChange={(e)=>setNovaObraNome(e.target.value)} placeholder="Nome da nova obra" className="flex-1 bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
              <button onClick={()=>{createObra(novaObraNome);setNovaObraNome("");setMostrarNovaObra(false);}} className="px-3 rounded-md text-sm font-semibold" style={{background:BLUE,color:"#fff"}}>Criar</button>
            </div>
          )}
          <div className="text-[10.5px] text-neutral-600">Cada obra tem seus próprios setores, equipes, restrições e semanas — trocar aqui não mistura dados entre obras.</div>
        </div>
      </SectionBlock>

      <SectionBlock color={RED} title="Segurança — senha de acesso">
        <div className="bg-neutral-900 border border-neutral-800 rounded-lg p-4 space-y-2.5">
          <div className="text-[11px] text-neutral-500">Senha compartilhada que a equipe inteira usa pra entrar no PCP.</div>
          <input value={novaSenha} onChange={(e)=>{setNovaSenha(e.target.value);setSenhaSalva(false);}} placeholder={`Senha atual: ${accessPassword}`} className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
          <button onClick={()=>{updatePassword(novaSenha);setNovaSenha("");setSenhaSalva(true);}} disabled={!novaSenha.trim()} className="w-full flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold" style={{background:novaSenha.trim()?RED:"#3a3a3a",color:novaSenha.trim()?"#fff":"#777"}}><ILock size={14}/> Trocar senha</button>
          {senhaSalva && <div className="text-[11px]" style={{color:GREEN}}>Senha atualizada.</div>}
        </div>
      </SectionBlock>

      <SectionBlock color={"#5B5B5B"} title="Conexão com o banco de dados (Firebase)">
        <div className="bg-neutral-900 border border-neutral-800 rounded-lg p-4 space-y-2.5">
          <div className="text-[11px] text-neutral-500">Só use isso se os dados pararem de salvar ou você tiver digitado algo errado na configuração inicial. Isso NÃO apaga nada no banco — só esquece a configuração deste dispositivo e pede pra digitar de novo.</div>
          <button onClick={()=>{ if(confirm("Reconfigurar a conexão com o Firebase neste dispositivo?")){ clearFirebaseConfig(); location.reload(); } }}
            className="w-full flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold border border-neutral-700 text-neutral-400">
            Reconfigurar Firebase neste dispositivo
          </button>
        </div>
      </SectionBlock>

      <SectionBlock color={ORANGE} title="Dados da obra">
        <div className="bg-neutral-900 border rounded-lg p-4 space-y-2.5" style={{borderColor:dirty?ORANGE:"#262626"}}>
          <div>
            <div className="text-[11px] text-neutral-500 mb-1 flex items-center gap-1"><IBuilding size={11}/> Nome da obra</div>
            <input value={draftObra.nome} onChange={(e)=>patchDraft({nome:e.target.value})} placeholder="Ex: Constance Camaçari" className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
          </div>
          <div>
            <div className="text-[11px] text-neutral-500 mb-1">Local da obra</div>
            <div className="grid grid-cols-[1fr_auto] gap-2">
              <input value={(draftObra.local||"").split("/")[0]?.trim()||""} onChange={(e)=>{const uf=(draftObra.local||"").split("/")[1]?.trim()||"";patchDraft({local:uf?`${e.target.value}/${uf}`:e.target.value});}} placeholder="Ex: Camaçari" className="bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
              <select value={(draftObra.local||"").split("/")[1]?.trim()||""} onChange={(e)=>{const cidade=(draftObra.local||"").split("/")[0]?.trim()||"";patchDraft({local:e.target.value?`${cidade}/${e.target.value}`:cidade});}} className="bg-neutral-950 border border-neutral-700 rounded-md px-2 py-2 text-sm outline-none w-[72px]">
                <option value="">UF</option>
                {UF_LIST.map((uf)=><option key={uf} value={uf}>{uf}</option>)}
              </select>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <div className="text-[11px] text-neutral-500 mb-1">Engenheiro responsável</div>
              <input value={draftObra.engenheiro} onChange={(e)=>patchDraft({engenheiro:e.target.value})} placeholder="Ex: Miguel" className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
            </div>
            <div>
              <div className="text-[11px] text-neutral-500 mb-1">Data prevista de entrega</div>
              <input type="date" value={draftObra.entrega} onChange={(e)=>patchDraft({entrega:e.target.value})} className="w-full bg-neutral-950 border border-neutral-700 rounded-md px-3 py-2 text-sm outline-none" />
            </div>
          </div>
          <div className="flex gap-2 pt-1">
            <button onClick={cancelarObra} disabled={!dirty} className="flex-1 flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold border border-neutral-700 text-neutral-400" style={{opacity:dirty?1:0.4}}><IX size={14}/> Cancelar</button>
            <button onClick={salvarObra} disabled={!dirty} className="flex-1 flex items-center justify-center gap-1.5 rounded-md py-2 text-sm font-semibold" style={{background:dirty?ORANGE:"#3a3a3a",color:dirty?BLACK:"#777"}}><ICheck size={14}/> Salvar</button>
          </div>
          <div className="text-[10.5px] text-neutral-600">{dirty?"Você tem alterações não salvas nesta obra.":"Esses dados aparecem no cabeçalho."}</div>
        </div>
      </SectionBlock>

      <ConfigList title="Setores" items={setores} value={novoSetor} setValue={setNovoSetor} onAdd={()=>{addSetor(novoSetor);setNovoSetor("");}} onRemove={removeSetor} placeholder="Novo setor" />
      <ConfigList title="Encarregados (cobram o resultado)" items={encarregados} value={novoEnc} setValue={setNovoEnc} onAdd={()=>{addEncarregado(novoEnc);setNovoEnc("");}} onRemove={removeEncarregado} placeholder="Novo encarregado" />
      <ConfigList title="Equipes (executam)" items={equipes} value={novaEquipe} setValue={setNovaEquipe} onAdd={()=>{addEquipe(novaEquipe);setNovaEquipe("");}} onRemove={removeEquipe} placeholder="Nova equipe" />
      <div className="text-[11px] text-neutral-600 pt-4 border-t border-neutral-800">Remover um item aqui não apaga compromissos já lançados com ele — só some das opções de novos lançamentos.</div>
      <div className="flex justify-center pt-4"><img src={MASN_WORDMARK} className="h-10 opacity-70" /></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot />);
</script>
</body>
</html>
